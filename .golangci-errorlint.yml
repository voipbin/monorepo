# Second golangci-lint configuration, used ONLY by the "Lint new-line
# conventions" CI step together with --new-from-merge-base=origin/main.
# (The file keeps its original name because CI path filters and docs reference it.)
#
# It holds the complexity limits only: gocyclo and nestif. The other
# convention linters (errorlint, noctx, rowserrcheck, bodyclose, nilerr,
# wastedassign, predeclared, copyloopvar, gocritic, contextcheck, gosec,
# forbidigo, revive, usestdlibvars, nolintlint) run on all code from
# .golangci.yml. docs/conventions/linting.md lists the rules, the thresholds
# and the nolint policy.
#
# It is separate from .golangci.yml on purpose: existing functions above the
# limits are not cleaned up yet (70 gocyclo and 21 nestif reports on
# 2026-10-23), so these two linters only report on lines a branch adds
# or changes. --new-from-merge-base is a global option, so adding it to the
# standard run would also hide issues on unchanged lines.
version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - gocyclo
    - nestif
  settings:
    gocyclo:
      min-complexity: 20
    nestif:
      min-complexity: 6
  exclusions:
    generated: lax
    paths:
      - (^|/)vendor(/|$)
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - nestif

issues:
  max-same-issues: 0

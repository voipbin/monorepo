# Second golangci-lint configuration, used ONLY by the "Lint error wrapping on
# new lines" CI step together with --new-from-merge-base=origin/main.
# docs/conventions/error-handling.md 4.2: fmt.Errorf must wrap an error with %w.
#
# It is separate from .golangci.yml on purpose: --new-from-merge-base is a
# global option, so adding it to the standard run would also hide issues on
# unchanged lines (for example an `unused` function whose last caller was
# removed). Existing violations are not reported; lines a branch adds or
# changes are.
version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - errorlint
  settings:
    errorlint:
      errorf: true
      comparison: false
      asserts: false
  exclusions:
    generated: lax
    paths:
      - (^|/)vendor(/|$)

issues:
  max-same-issues: 0

apiVersion: apps/v1
kind: Deployment
metadata:
  name: schedule-manager
  labels:
    app: schedule-manager
spec:
  # replicas: 2 from day one (design §3) — the claim machinery (Redis lock +
  # DB CAS) makes concurrent replicas safe; this is the failover premise.
  replicas: 2
  selector:
    matchLabels:
      app: schedule-manager
  template:
    metadata:
      labels:
        app: schedule-manager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "2112"
    spec:
      containers:
        - name: schedule-manager
          image: schedule-manager-image
          command:
            - './schedule-manager'
          # SCHEDULE_BACKUP_DIR is intentionally NOT set here (design §7):
          # production GCP uses managed Cloud SQL backups and the seeded
          # database-backup schedule stays disabled. Self-hosted stacks wire
          # a shared ReadWriteMany volume + this env var via VOIP-1281.
          env:
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: voipbin
                  key: DATABASE_DSN_BIN
            - name: PROMETHEUS_ENDPOINT
              value: "/metrics"
            - name: PROMETHEUS_LISTEN_ADDRESS
              value: ":2112"
            - name: RABBITMQ_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: voipbin
                  key: RABBITMQ_ADDRESS
            - name: REDIS_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: voipbin
                  key: REDIS_ADDRESS
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voipbin
                  key: REDIS_PASSWORD
            - name: REDIS_DATABASE
              valueFrom:
                secretKeyRef:
                  name: voipbin
                  key: REDIS_DATABASE
          ports:
            - name: metrics
              protocol: "TCP"
              containerPort: 2112
          resources:
            requests:
              cpu: "1m"
              memory: "3M"
            limits:
              cpu: "10m"
              memory: "30M"

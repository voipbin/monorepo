put:
  summary: Store the secret of a number provider
  description: |
    Stores the secret (for example the API token) of the given number provider, encrypted. The secret is write-only: it is never returned, logged or placed in an event. The response tells only `has_secret`, the `key_version` that encrypted it and who changed it.
    The service does not use the stored secret: the provider secret is read from the platform environment, so this call does not change the credential of the provider, and `has_secret` and `credential_source` in the response follow the platform environment.
    The value is trimmed of surrounding whitespace, and must be 1 to 1024 bytes long after that (multi-byte characters count per byte).
    The provider's required `config` keys must already be set (see `PUT /number_providers/{provider_name}`), otherwise the request is rejected with 400. When the platform has no encryption key the request is answered with 503 before the `config` rule is checked.
    Replacing the secret with the token of another account makes the numbers purchased through the previous account impossible to release.
    Requires the project super admin permission.
  tags:
    - NumberProvider
  parameters:
    - name: provider_name
      in: path
      required: true
      description: "The name of the number provider. Returned from the `provider_name` field of the `GET /number_providers` response. Only the providers the platform supports are accepted (for example `telnyx`)."
      schema:
        type: string
        pattern: '^[a-z0-9_]{1,32}$'
        example: telnyx
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/NumberManagerNumberProviderSecretRequest'
  responses:
    '200':
      description: The number provider with the secret stored. The secret is not included.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NumberManagerNumberProvider'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '503':
      $ref: '#/components/responses/Unavailable'
    '500':
      $ref: '#/components/responses/InternalError'

delete:
  summary: Delete the stored secret of a number provider
  description: |
    Deletes the secret that was stored through the API. The service does not use the stored secret, so the credential of the provider does not change: `credential_source` stays `env` and `has_secret` stays true while the platform environment holds a secret for the provider, and both are `none` and false otherwise.
    It returns 404 when no request has created a stored setting for the provider yet (a rejected secret request can also create one).
    Requires the project super admin permission.
  tags:
    - NumberProvider
  parameters:
    - name: provider_name
      in: path
      required: true
      description: "The name of the number provider. Returned from the `provider_name` field of the `GET /number_providers` response. Only the providers the platform supports are accepted (for example `telnyx`)."
      schema:
        type: string
        pattern: '^[a-z0-9_]{1,32}$'
        example: telnyx
  responses:
    '200':
      description: The number provider after the secret was deleted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NumberManagerNumberProvider'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

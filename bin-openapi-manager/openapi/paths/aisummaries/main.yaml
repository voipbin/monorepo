get:
  summary: Gets a list of ai summaries.
  description: >-
    Retrieves a paginated list of ai summaries for the authenticated customer.
    Optionally filter by the origin resource (reference_type + reference_id) to
    find all summaries tied to a specific call, conference, transcribe, or
    recording. Note a single reference can have multiple summaries (e.g.
    regenerated summaries), so this always returns a list, not a single item.
  tags:
    - AI
  parameters:
    - $ref: '#/components/parameters/PageSize'
    - $ref: '#/components/parameters/PageToken'
    - name: reference_type
      in: query
      required: false
      description: >-
        Filter by the reference type of the origin resource. Must be supplied
        together with reference_id; supplying only one of the two returns a
        400 error.
      schema:
        $ref: '#/components/schemas/AIManagerSummaryReferenceType'
      example: "recording"
    - name: reference_id
      in: query
      required: false
      description: >-
        Filter by the ID of the origin resource (e.g. a recording ID returned
        from `GET /recordings`). Must be supplied together with reference_type;
        supplying only one of the two returns a 400 error.
      schema:
        type: string
        format: uuid
      example: "5e4a0680-804e-11ec-8477-2fea5968d85b"
  responses:
    '200':
      description: A list of ai summaries.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/CommonPagination'
              - type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/AIManagerSummary'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '500':
      $ref: '#/components/responses/InternalError'

post:
  summary: Create a new ai summary.
  description: Creates a new ai summary and returns the created ai summary's details.
  tags:
    - AI
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            on_end_flow_id:
              type: string
              description: The ID of the flow to be executed when the ai summary ends.
            reference_type:
              $ref: '#/components/schemas/AIManagerSummaryReferenceType'
            reference_id:
              type: string
              description: The ID of the reference for the ai summary.
            language:
              type: string
              description: The language of the ai summary.
          required:
            - on_end_flow_id
            - reference_type
            - reference_id
            - language
  responses:
    '200':
      description: Details of the created ai summary.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AIManagerSummary'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '500':
      $ref: '#/components/responses/InternalError'

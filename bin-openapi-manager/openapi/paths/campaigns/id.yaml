get:
  summary: Get campaign details
  description: Retrieves detailed information about a specific campaign by its ID.
  tags:
    - Campaign
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: ID of the campaign
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CampaignManagerCampaign'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

put:
  summary: Update a campaign
  description: Updates the details of an existing campaign and returns the updated campaign.
  tags:
    - Campaign
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: ID of the campaign
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              description: Updated name of the campaign. Omit to leave unchanged.
            detail:
              type: string
              description: Updated details of the campaign. Omit to leave unchanged.
            type:
              allOf:
                - $ref: '#/components/schemas/CampaignManagerCampaignType'
              description: Updated type of the campaign. Omit to leave unchanged.
            service_level:
              type: integer
              description: Updated service level of the campaign. Omit to leave unchanged.
            end_handle:
              allOf:
                - $ref: '#/components/schemas/CampaignManagerCampaignEndHandle'
              description: Updated end handle of the campaign. Omit to leave unchanged.
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CampaignManagerCampaign'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

delete:
  summary: Delete a campaign
  description: Deletes a campaign by its ID.
  tags:
    - Campaign
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: ID of the campaign
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CampaignManagerCampaign'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      $ref: '#/components/responses/Conflict'
    '500':
      $ref: '#/components/responses/InternalError'

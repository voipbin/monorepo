get:
  summary: List all messages
  description: Retrieves a list of messages for the given customer.
  tags:
    - Message
  parameters:
    - $ref: '#/components/parameters/PageSize'
    - $ref: '#/components/parameters/PageToken'
  responses:
    '200':
      description: A list of messages.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/CommonPagination'
              - type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageManagerMessage'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '500':
      $ref: '#/components/responses/InternalError'

post:
  summary: Send a message and return the sent message
  description: Sends a message with the provided information and returns the sent message details.
  tags:
    - Message
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            source:
              description: The source of the message.
              $ref: '#/components/schemas/CommonAddress'
            destinations:
              description: List of destinations for the message.
              type: array
              items:
                type: string
                $ref: '#/components/schemas/CommonAddress'
            text:
              description: >-
                The content of the message. For a message with `medias` it can be an empty string. A text without
                `medias` of more than one segment is sent as an MMS and charged at the MMS price; more than 10
                segments is rejected with `TEXT_TOO_LONG`.
              type: string
            medias:
              description: >-
                The ids of the files to attach, returned from the `POST /storage_files` response (upload with
                type `media`). When this list is not empty the message is sent as an MMS. At most 10 files; the
                total size is limited to 900 KiB, images up to 900 KiB each, and audio (mp3, wav) and pdf up to
                600 KiB each. Only files of the same customer can be attached.
              type: array
              maxItems: 10
              items:
                type: string
                format: uuid
                x-go-type: string
                example: "3f2b1c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
          required:
            - source
            - destinations
            - text
  responses:
    '200':
      description: The sent message details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageManagerMessage'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '402':
      $ref: '#/components/responses/PaymentRequired'
    '500':
      $ref: '#/components/responses/InternalError'

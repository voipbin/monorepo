get:
  summary: Gets the list of available AI engine models.
  description: |
    Returns the catalog of engine models that can be set in the `engine_model` field of an AI.
    The whole catalog is returned in a single page, so `page_size` and `page_token` are not used.
    Each model has a `key_mode`: `platform` means the platform supplies access and `engine_key` is ignored, `own_or_default` means your `engine_key` is used or the platform default key when empty, and `own_required` means `engine_key` is mandatory.
  tags:
    - AI
  responses:
    '200':
      description: The list of available AI engine models.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/CommonPagination'
              - type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/AIManagerAIModel'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '500':
      $ref: '#/components/responses/InternalError'

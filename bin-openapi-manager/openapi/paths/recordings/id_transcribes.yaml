get:
  summary: List transcribes for a recording
  description: >-
    Retrieves the transcribes tied to a specific recording, regardless of the
    transcribe owner. This includes transcribes produced internally when an AI
    summary was generated for the recording, which are not visible through the
    top-level `GET /transcribes` list (that list is scoped to the caller's own
    customer). Access is gated by ownership of the recording itself: the caller
    must be an admin/manager of the recording's owning customer. A single
    recording can have multiple transcribes (e.g. one per language), so this
    always returns a list.
  tags:
    - Recording
  parameters:
    - name: id
      in: path
      required: true
      description: The recording's ID.
      schema:
        type: string
    - $ref: '#/components/parameters/PageSize'
    - $ref: '#/components/parameters/PageToken'
  responses:
    '200':
      description: A list of transcribes tied to the recording.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/CommonPagination'
              - type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/TranscribeManagerTranscribe'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'
    '503':
      $ref: '#/components/responses/Unavailable'

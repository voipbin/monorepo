post:
  summary: Run one turn of the flow builder conversation.
  description: >
    Not released and not yet evaluated by a human; do not build on it. There is no on/off setting: wherever the platform key is configured this endpoint answers and the platform pays for each call.


    Sends the whole conversation so far and receives the builder's next message, plus a draft
    flow once it has enough information. Nothing is saved: the draft only fills the flow editor,
    and the user reviews it and saves it through `POST /flows`.


    The server keeps no conversation. The client sends the full history and the latest `draft`
    on every turn. Each message must be `user` or `assistant`, and the last one must be `user`.
    Strict alternation is not enforced.


    `supported_action_types` is the list of action types the client's editor can render and
    round-trip faithfully. The server uses only the types that are both allowed for the builder
    and in this list, so a client can only narrow what the builder offers.


    The draft is decided by the server, not by the model's prose. Every id is generated by the
    server and every reference between actions is resolved by it. Resource references (queues,
    assistants, other flows, and so on) are always left empty and reported with
    `select_resource` in `draft_warnings`; the user picks them in the editor.


    The request body may not exceed 512 KiB (524288 bytes), which is enforced while the body is read; a
    larger body is answered with BUILDER_INPUT_TOO_LARGE (400). The per-message and total limits of the
    conversation are the ones reported by `GET /ai_builder/status`. A draft may have at most 60 actions.


    Each call counts against a per-customer daily limit that is separate from the assistant builder's,
    from the moment it starts running. That includes a call that then fails (a provider error, a
    timeout, or a model answer that could not be used). A call refused because the request was
    invalid, the builder was unavailable, or the service was busy, is not counted.


    Requires an Agent identity with the customer admin or manager permission. Availability is
    reported by `GET /ai_builder/status`.
  tags:
    - Flow
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/FlowManagerFlowBuilderChatRequest'
  responses:
    '200':
      description: The builder's next message and, when ready, a draft.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FlowManagerFlowBuilderChatResponse'
    '400':
      description: >
        The request is invalid (INVALID_ARGUMENT), the body is not valid JSON
        (INVALID_JSON_BODY), or the body exceeded the size limit (BUILDER_INPUT_TOO_LARGE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '429':
      description: >
        The daily limit was reached (BUILDER_DAILY_LIMIT), or the service is busy and the
        request was not run (BUILDER_BUSY). Only the busy case is worth retrying soon. The
        per-customer and per-IP request rate limits can also answer 429 with the reason
        RATE_LIMIT_EXCEEDED, which is worth retrying after a short wait.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '500':
      $ref: '#/components/responses/InternalError'
    '503':
      description: >
        The builder is not available. The `reason` is one of BUILDER_UNAVAILABLE (no key is configured, or the counter is down; the same reason
        covers both, so a retry helps only in the second case), BUILDER_TIMEOUT (took too long),
        BUILDER_RESPONSE_INVALID (the model's answer or the provider failed), or
        SERVICE_UNAVAILABLE (the service is temporarily cut off). BUILDER_TIMEOUT,
        BUILDER_RESPONSE_INVALID and SERVICE_UNAVAILABLE are worth retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

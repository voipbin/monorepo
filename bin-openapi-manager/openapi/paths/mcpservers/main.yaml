get:
  summary: Gets a list of MCP servers.
  description: Retrieves a paginated list of customer-registered MCP (Model Context Protocol) servers.
  tags:
    - AI
  parameters:
    - $ref: '#/components/parameters/PageSize'
    - $ref: '#/components/parameters/PageToken'
  responses:
    '200':
      description: A list of MCP servers.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/CommonPagination'
              - type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/AIManagerMcpServer'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '500':
      $ref: '#/components/responses/InternalError'

post:
  summary: Register a new MCP server.
  description: >
    Registers a remote Streamable-HTTP MCP server owned by the authenticated customer.
    Opt an AI in via the AI's `mcp_server_ids` field to expose the server's tools to that AI's sessions.
  tags:
    - AI
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              description: Name of the MCP server.
              example: "Internal Ticketing System"
            detail:
              type: string
              description: Detailed description of the MCP server.
              example: "Exposes ticket lookup/creation tools to the LLM."
            url:
              type: string
              format: uri
              description: "Streamable-HTTP MCP endpoint. Must be https."
              example: "https://mcp.example.com/mcp"
            auth_type:
              type: string
              enum: ["", "bearer", "api_key"]
              description: "How the outbound MCP call authenticates. Empty string sends no Authorization header."
              example: "bearer"
            api_key_header:
              type: string
              description: "Header name used when auth_type is api_key, e.g. X-API-Key. Ignored otherwise."
              example: "X-API-Key"
            secret:
              type: string
              description: "Bearer token or API key value. Stored encrypted at rest; never returned in responses."
              example: "sk-live-...redacted..."
          required:
            - name
            - url
  responses:
    '200':
      description: The created MCP server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AIManagerMcpServer'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '500':
      $ref: '#/components/responses/InternalError'

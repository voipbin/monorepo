post:
  summary: Start the vendor OAuth flow for an MCP server connection.
  description: >
    Starts a vendor-fixed OAuth 2.1 authorization-code + PKCE flow so the
    authenticated customer can connect a GitHub or Linear account to an
    MCP server without ever handling a client_id/client_secret. Returns
    the vendor's authorize_url to redirect the user's browser to, plus a
    link_token used to correlate the eventual POST /mcpservers/oauth/complete
    call back to this flow.
  tags:
    - AI
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            vendor:
              type: string
              enum: ["github", "linear"]
              description: The OAuth vendor to connect to.
              example: "github"
            mcp_server_id:
              type: string
              format: uuid
              description: >
                Optional. The ID of an existing customer-owned MCP server
                (returned from a prior POST /mcpservers response) to
                reconnect/refresh OAuth credentials for. Omit to create a
                new MCP server on completion.
              example: "0b61dcbe-a770-11ed-bab4-2fc1dac66672"
          required:
            - vendor
  responses:
    '200':
      description: The vendor authorize URL and a correlating link token.
      content:
        application/json:
          schema:
            type: object
            properties:
              authorize_url:
                type: string
                format: uri
                description: Redirect the user's browser here to start the vendor's consent screen.
                example: "https://github.com/login/oauth/authorize?client_id=...&state=..."
              link_token:
                type: string
                description: Opaque token correlating this flow to the later POST /mcpservers/oauth/complete call.
                example: "9f2c1e7a4b3d4f5e8a9b0c1d2e3f4a5b"
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

get:
  summary: Get an MCP server by ID.
  description: Returns a single customer-registered MCP server record.
  tags:
    - AI
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The MCP server ID.
  responses:
    '200':
      description: The MCP server record.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AIManagerMcpServer'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

put:
  summary: Update an MCP server.
  description: >
    Every field is optional. Omitting a field leaves its current value
    unchanged; a full resend of every field is NOT required to update a
    single field (e.g. `PUT { "name": "new name" }` only renames the
    server and leaves url/status/auth_type/api_key_header/secret exactly
    as they were).
  tags:
    - AI
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The MCP server ID.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              description: "Omit to leave the current name unchanged."
            detail:
              type: string
              description: "Omit to leave the current detail unchanged."
            url:
              type: string
              format: uri
              description: "Streamable-HTTP MCP endpoint. Must be https. Omit to leave the current URL unchanged."
            status:
              type: string
              enum: ["active", "disabled"]
              description: "Set to disabled to stop VoIPBin connecting to this server, without deleting it: it is skipped during tool discovery immediately, and its tools will be excluded from every referencing AI when tool use ships. Omit to leave the current status unchanged."
              example: "active"
            auth_type:
              type: string
              enum: ["", "bearer", "api_key", "oauth"]
              description: "Omit to leave the current auth_type unchanged. NOTE: an explicit empty string (\"\") is a valid value meaning no-auth, distinct from omitting the field. \"oauth\" is accepted only on a server that is already OAuth-connected, so a client that re-submits the current auth_type unchanged is never rejected; moving a server INTO oauth is done by completing the OAuth authorization flow, not by this field, and is rejected with INVALID_MCP_SERVER_AUTH_TYPE. Moving a connected server OUT of oauth is allowed and erases its stored OAuth tokens."
            api_key_header:
              type: string
              description: "Omit to leave the current api_key_header unchanged."
            secret:
              type: string
              description: "Omit this field to leave the existing secret unchanged. Send an empty string to clear it."
  responses:
    '200':
      description: Details of the updated MCP server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AIManagerMcpServer'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

delete:
  summary: Delete an MCP server.
  description: Soft-deletes an MCP server record.
  tags:
    - AI
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The MCP server ID.
  responses:
    '200':
      description: The deleted MCP server record.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AIManagerMcpServer'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

put:
  summary: Update the order number's flow ID
  description: Update the flow ID of the order number identified by the provided ID.
  tags:
    - Number
  parameters:
    - name: id
      in: path
      required: true
      description: The ID of the order number to update.
      schema:
        type: string
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            call_flow_id:
              description: >-
                The ID of the updated call flow. Omit to leave unchanged.
              type: string
            message_flow_id:
              description: >-
                The ID of the updated message flow. Omit to leave unchanged.
              type: string
  responses:
    '200':
      description: The updated order number details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NumberManagerNumber'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

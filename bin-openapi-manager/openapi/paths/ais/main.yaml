get:
  summary: Gets a list of ais.
  description: Retrieves a paginated list of ais.
  tags:
    - AI
  parameters:
    - $ref: '#/components/parameters/PageSize'
    - $ref: '#/components/parameters/PageToken'
  responses:
    '200':
      description: A list of ais.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/CommonPagination'
              - type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/AIManagerAI'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '500':
      $ref: '#/components/responses/InternalError'

post:
  summary: Create a new ai.
  description: Creates a new ai and returns the created ai's details.
  tags:
    - AI
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
            detail:
              type: string
            type:
              type: string
              enum: ["normal", "insight"]
              description: "AI type. `normal` (default) is a general-purpose AI. `insight` limits the AI's built-in tools to the Insight tool set, adds the tools of the MCP servers in its own `mcp_server_ids`, and uses a dedicated system prompt."
              example: "normal"
            engine_model:
              $ref: '#/components/schemas/AIManagerAIEngineModel'
            parameter:
              type: object
              additionalProperties: true
              description: Data associated with the ai's engine, can be dynamic and vary based on the engine type.
            engine_key:
              type: string
              description: "API key or credential for the AI engine. Required when engine_model starts with openrouter. (400 ENGINE_KEY_REQUIRED if empty)."
            engine_base_url:
              type: string
              description: "Base URL of the customer-hosted OpenAI-compatible server. Required when engine_model starts with `customendpoint.` (400 ENGINE_BASE_URL_REQUIRED if empty); not allowed for any other model (400 ENGINE_BASE_URL_NOT_ALLOWED). Only https is accepted. Do not put credentials, tokens or other secrets in the URL; the URL is not secret and is returned in responses, events and webhooks. Send the key in `engine_base_key` instead."
              example: "https://llm.example.com/v1"
            engine_base_key:
              type: string
              nullable: true
              writeOnly: true
              description: "API key for the server at `engine_base_url`. Write-only; never returned. Optional. Allowed only with a `customendpoint.` model. A key is 1 to 512 printable ASCII characters."
            rag_id:
              type: string
              description: "The knowledge base ID (UUID) for the search_knowledge tool. Returned from the `id` field of the `GET /rags` response. Send empty string or omit to clear."
            init_prompt:
              type: string
            tts_type:
              type: string
              description: Text-to-speech engine type.
            tts_voice_id:
              type: string
              description: Voice ID for the text-to-speech engine.
            stt_type:
              type: string
              description: Speech-to-text engine type.
            stt_language:
              type: string
              description: "STT language in BCP-47 format (e.g., ko-KR, en-US)."
              example: "en-US"
            vad_config:
              $ref: '#/components/schemas/AIManagerVADConfig'
              description: Voice Activity Detection configuration. All fields are optional.
            tool_names:
              type: array
              items:
                $ref: '#/components/schemas/AIManagerToolName'
              description: >-
                List of tool names to enable for this AI. Use ["all"] to
                enable all available tools. For type=insight AIs, only
                Insight tool names are permitted (currently:
                get_contact_interactions, get_conversation_content,
                get_related_cases, get_case_notes, get_contact_profile,
                get_call_transcript, emit_info_card, search_knowledge, and
                notify_agent,
                usable only while the assistant is monitoring a live call);
                type=normal AIs may use any Normal tool name or ["all"].
                Tools for type=insight AIs that send, call or propose an SMS, an email or a call: `send_message`, `send_email` and `create_call` (act right
                away, without an agent's confirmation; an email is sent from the platform's default sender address and its delivery is not confirmed;
                a call is placed at once, runs the given flow or actions when the callee answers, and its minutes are charged to the account) and
                `draft_message`, `draft_email` and `draft_call` (show a draft card that an agent approves or rejects; nothing is sent or called until the
                agent approves). `describe_action` is also available to type=insight AIs so that the `actions` of `create_call` and `draft_call` can be
                assembled. They can be named explicitly and are included by `["all"]`, so an Insight AI stored with `["all"]` gets all seven. `search_knowledge` is also available to type=insight AIs and is
                included by `["all"]`; it is offered only when the AI has a `rag_id`. A customer who does not want direct sending or calling names the draft tools (and
                `describe_action`) instead of `["all"]`. `draft_message`, `draft_email` and `draft_call` are available to type=insight AIs only.
                Mismatched combinations are rejected with a 400.
            mcp_server_ids:
              type: array
              items:
                type: string
                format: uuid
                x-go-type: string
              description: >-
                List of customer-registered MCP server IDs whitelisted for this AI. Each ID must
                reference an MCP server owned by the same customer. Returned from the `id` field
                of the `POST /mcpservers` response.
              example: []
            auto_aicall_audit_enabled:
              type: boolean
              description: When true, any finished AICall involving this AI is audited automatically.
              example: false
          required:
            - name
            - detail
            - engine_model
            - parameter
            - engine_key
            - init_prompt
            - tts_type
            - tts_voice_id
            - stt_type
  responses:
    '200':
      description: Details of the created ai.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AIManagerAI'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '500':
      $ref: '#/components/responses/InternalError'

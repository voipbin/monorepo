post:
  summary: Decide a draft
  description: >-
    Approves or rejects a draft card that the Insight Assistant produced with the
    `draft_message` tool (an SMS draft, block type `sms_draft`) or the `draft_email` tool (an email
    draft, block type `email_draft`). On `approve` the platform sends the draft without involving the
    LLM and records the result in the aicall's message history: an SMS draft is sent to the stored
    recipient with the stored text, and an email draft is sent to the stored recipients with the
    stored subject and plain text content, in both cases from the account's default sender. On
    `reject` nothing is sent and the rejection is recorded. The draft id is the `id` of the `tool`
    message that carries the `sms_draft` or `email_draft` block.

    A draft can be decided once. A repeated or opposite decision is refused with
    `DRAFT_ALREADY_DECIDED`. A draft that is not decided within 10 minutes of its creation (the
    default; operators can change it) is refused with `DRAFT_EXPIRED`. Both refusals answer with HTTP 409. An unknown draft, or a draft of another aicall or
    customer, is refused with `DRAFT_NOT_FOUND`. On `approve`, a stored draft that no longer passes
    validation is refused with `DRAFT_INVALID` (HTTP 400) before anything is sent; the draft stays
    undecided and can still be rejected. The aicall must belong to the service
    agent's own customer. A send failure is returned as a normal response whose
    message content has `result` set to `failed`. An email is sent asynchronously: for an email draft,
    `result` `success` means the platform accepted the email for sending and does not confirm delivery.
  tags:
    - Service Agent
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            aicall_id:
              type: string
              format: uuid
              description: >-
                The ID of the aicall the draft belongs to. Returned from the
                `POST /service_agents/aicalls` or `GET /service_agents/aicalls` response.
              example: "5e4a0680-804e-11ec-8477-2fea5968d85b"
            draft_id:
              type: string
              format: uuid
              description: >-
                The ID of the `tool` message that carries the `sms_draft` or `email_draft` block.
                Returned from the `id` field of the `GET /service_agents/aimessages` response or of
                the `aimessage_created` event.
              example: "7a1c3f80-804e-11ec-8477-2fea5968d85b"
            decision:
              $ref: '#/components/schemas/AIManagerMessageDraftDecision'
          required:
            - aicall_id
            - draft_id
            - decision
  responses:
    '200':
      description: The `tool` message that records the decision result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AIManagerMessage'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      $ref: '#/components/responses/Conflict'
    '500':
      $ref: '#/components/responses/InternalError'

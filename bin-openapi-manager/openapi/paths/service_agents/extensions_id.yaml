get:
  summary: Get extension details
  description: |
    Retrieves detailed information about a specific extension of the authenticated agent's customer by its ID.

    The `password` and `direct_hash` fields are returned only when the extension is assigned to the authenticated agent.
    For an extension assigned to someone else they are returned as empty strings.

    An extension that does not exist, that has been deleted, or that belongs to another customer is reported identically as `404 EXTENSION_NOT_FOUND`.
  tags:
    - Service Agent
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the extension.
  responses:
    '200':
      description: The details of the extension.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrarManagerExtension'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

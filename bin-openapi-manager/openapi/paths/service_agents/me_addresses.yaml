put:
  summary: Update authenticated agent's addresses
  description: |
    Updates the address details of the authenticated agent and returns the updated information.
    The list replaces the stored addresses. The `tel` and `sip` addresses can be freely added, changed and removed.
    The `extension` addresses can only be kept or removed. An `extension` address that is not already stored on the
    agent is rejected with `403` (`EXTENSION_ADDRESS_ADMIN_ONLY`) regardless of the caller's role, because
    the `extension` addresses are assigned by an administrator through `PUT /agents/{id}/addresses` or `POST /agents`.
    To keep a stored `extension`, send it back unchanged as returned by `GET /service_agents/me`.
    A `tel` address must contain at least one digit.
  tags:
    - Service Agent
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            addresses:
              type: array
              items:
                $ref: '#/components/schemas/CommonAddress'
              description: The updated list of addresses.
          required:
            - addresses
  responses:
    '200':
      description: The updated address information of the agent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentManagerAgent'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '500':
      $ref: '#/components/responses/InternalError'

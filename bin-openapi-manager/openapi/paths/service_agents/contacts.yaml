get:
  summary: List contacts
  description: |
    Get contacts for the service agent's customer. With `starred=true` the list holds only the
    contacts the calling agent has starred. The order and the page token are the same in both
    cases: the contact's `tm_create`, newest first (not the time the contact was starred).
  tags:
    - Service Agent
  parameters:
    - $ref: '#/components/parameters/PageSize'
    - $ref: '#/components/parameters/PageToken'
    - name: starred
      in: query
      required: false
      description: "When true, return only the contacts the calling agent has starred (see PUT /service_agents/contacts/{id}/star). False or omitted returns all contacts."
      schema:
        type: boolean
        example: true
  responses:
    '200':
      description: Successful response.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/CommonPagination'
              - type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContactManagerContact'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '500':
      $ref: '#/components/responses/InternalError'

post:
  summary: Create a new contact
  description: Create a new contact for the service agent's customer.
  tags:
    - Service Agent
  requestBody:
    description: Request body to create a new contact.
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            first_name:
              type: string
            last_name:
              type: string
            display_name:
              type: string
            company:
              type: string
            job_title:
              type: string
            source:
              type: string
              enum: [manual, import, api, sync]
            external_id:
              type: string
            notes:
              type: string
            addresses:
              type: array
              description: List of addresses (tel or email) to associate with the contact.
              items:
                allOf:
                  - $ref: '#/components/schemas/CommonAddress'
                  - type: object
                    properties:
                      is_primary:
                        type: boolean
                        description: Whether this is the primary address of its type.
            tag_ids:
              type: array
              items:
                type: string
                format: uuid
  responses:
    '201':
      description: Contact created successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContactManagerContact'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '500':
      $ref: '#/components/responses/InternalError'

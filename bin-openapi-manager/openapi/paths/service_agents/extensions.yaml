get:
  summary: Get list of extensions
  description: |
    Retrieves a paginated list of the extensions of the authenticated agent's customer.

    The `password` and `direct_hash` fields are returned only for the extensions assigned to the authenticated agent.
    For every other extension of the customer they are returned as empty strings.
    The agent's own extensions can be identified through the `addresses` (`type: extension`) of `GET /service_agents/me`.
  tags:
    - Service Agent
  parameters:
    - $ref: '#/components/parameters/PageSize'
    - $ref: '#/components/parameters/PageToken'
  responses:
    '200':
      description: A list of extensions.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/CommonPagination'
              - type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegistrarManagerExtension'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '500':
      $ref: '#/components/responses/InternalError'

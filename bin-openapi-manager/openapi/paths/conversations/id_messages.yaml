get:
  summary: Gets a list of conversation messages
  description: Gets a paginated list of messages for a specific conversation.
  tags:
    - Conversation
  parameters:
    - $ref: '#/components/parameters/PageSize'
    - $ref: '#/components/parameters/PageToken'
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the conversation.
  responses:
    '200':
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/CommonPagination'
              - type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConversationManagerMessage'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

post:
  summary: Send a message
  description: Sends a message to a specific conversation and returns the sent message info.
  tags:
    - Conversation
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the conversation.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            text:
              type: string
              description: The message text.
            medias:
              description: >-
                Files to attach. In a conversation that sends SMS, each item must carry the storage file id in
                `id` (the id returned from the `POST /storage_files` response, uploaded with type `media`); the
                message is then sent as an MMS and the limits of `POST /messages` apply. An item without a valid
                `id` is rejected with `MEDIA_ID_REQUIRED`. Other conversation types do not send attachments and
                ignore this list.
              type: array
              items:
                $ref: '#/components/schemas/ConversationManagerMedia'
          required:
            - text
            - medias
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConversationManagerMessage'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

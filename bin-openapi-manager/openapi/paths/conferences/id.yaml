get:
  summary: Get conference details
  description: Retrieve detailed information about a specific conference.
  tags:
    - Conference
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the conference
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConferenceManagerConference'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

put:
  summary: Update conference details
  description: Update the details of a specific conference.
  tags:
    - Conference
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the conference
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              description: Name of the conference. Omit to leave unchanged.
            detail:
              type: string
              description: Detail of the conference. Omit to leave unchanged.
            data:
              type: object
              description: >-
                Custom data associated with the conference. Omit to leave
                unchanged; send an explicit empty object ({}) to clear
                all custom data.
              additionalProperties: true
            timeout:
              type: integer
              description: >-
                Auto-termination timeout in seconds. 0 disables
                auto-termination and is a real, settable value distinct
                from omission. Omit to leave unchanged.
            pre_flow_id:
              type: string
              description: >-
                Flow to run before participants join. Omit to leave
                unchanged.
            post_flow_id:
              type: string
              description: >-
                Flow to run after the conference ends. Omit to leave
                unchanged.
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConferenceManagerConference'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

delete:
  summary: Delete a conference
  description: Delete a specific conference. All participants will be removed.
  tags:
    - Conference
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the conference
  responses:
    '200':
      description: Conference deleted successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConferenceManagerConference'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

post:
  summary: Reissue a direct token without changing which resource it is bound to.
  description: |
    Extends a boot session past the 4 hour token expiry while keeping the same
    `allowed_resource_id`, so a conversation in progress is not interrupted.

    Unlike `POST /auth/boot` this endpoint is authenticated: present the current
    direct token as `Bearer <token>`. The resource assignment is copied from that
    token and never read from the request body, so a caller cannot name a
    resource it does not already hold.

    Refreshing does not extend a session indefinitely. Each token carries an
    absolute ceiling fixed at the original boot, and the reissued token inherits
    it unchanged. Revoking the direct link (regenerating its hash), deleting the
    direct record, or deactivating the customer all take effect on the next
    refresh.
  tags:
    - Auth
  operationId: postAuthBootRefresh
  # This spec declares no securitySchemes, so authentication is described in
  # the text above rather than with a security block, matching the sibling
  # /auth/* paths. Adding one here emits a reference the generator cannot
  # resolve.
  responses:
    '200':
      description: Token reissued. `allowed_resource_id` is unchanged; only `expire` moves.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthBootResponse'
    '401':
      description: |
        The token can no longer be refreshed. Boot again. Possible causes:
        - The token predates resource binding and carries no assignment.
        - The boot session's absolute lifetime has elapsed.
        - The direct link was deleted or its hash was regenerated.
        - The owning customer is no longer active.
    '403':
      description: The presented token is not a direct token.

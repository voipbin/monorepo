put:
  summary: Store the secret of a config key
  description: |
    Stores the secret of the key, encrypted. The secret is write-only: it is never returned, logged or placed in an event. The response tells only `has_secret`, the `key_version` that encrypted it, the new `revision` and who changed it. The change is recorded in the history without the value.
    The secret must be 1 to 2020 bytes long (multi-byte characters count per byte) and must not start or end with white space or contain a line break; such a value is rejected with 400 and is not trimmed. A key can declare a shorter limit (the email, ai, message, tts and transcribe keys allow 512 bytes). A request body larger than 4 KB is rejected with 400.
    The `revision` is the revision that the caller read from `GET /service_configs/{service}`. When the stored revision is different the request is rejected with 409 and the reason `REVISION_MISMATCH`, and nothing is changed. 0 means that the key has no stored value. The revision starts at 1 again when a key is deleted and set again, so a caller that still holds revision 1 from before the delete is not detected.
    When the platform has no encryption key the request is answered with 503 and the reason `ENCRYPTION_KEY_NOT_CONFIGURED`. When the answer is 500 with the reason `CONFIG_WRITE_VERIFY_FAILED` the change may have been stored: reload the key before you try again. After a timeout or a 5xx answer, check the state before sending the secret again.
    The response shows the state right after the write; another change that happens at the same moment can already be in it.
    Requires the project super admin permission.
  tags:
    - ServiceConfig
  parameters:
    - $ref: '#/components/parameters/ServiceConfigService'
    - $ref: '#/components/parameters/ServiceConfigKeyName'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ServiceConfigKeySecretRequest'
  responses:
    '200':
      description: The key with the secret stored. The secret is not included.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceConfigKey'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      $ref: '#/components/responses/Conflict'
    '503':
      $ref: '#/components/responses/Unavailable'
    '500':
      $ref: '#/components/responses/InternalError'

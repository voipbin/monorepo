get:
  summary: List the changes of a config key
  description: |
    Returns the changes of the key, the newest first. A change of a secret has the key versions only, never a value. The default page size is 20 and the largest is 100; a larger value is lowered to 100. A `page_token` that was not returned by this API for this key is rejected with 400.
    The time of an entry is the time at which the change was made; two changes that are made at the same moment can appear in either order.
    Requires the project super admin permission.
  tags:
    - ServiceConfig
  parameters:
    - $ref: '#/components/parameters/ServiceConfigService'
    - $ref: '#/components/parameters/ServiceConfigKeyName'
    - $ref: '#/components/parameters/PageSize'
    - $ref: '#/components/parameters/PageToken'
  responses:
    '200':
      description: A page of the history of the key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceConfigHistoryList'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '503':
      $ref: '#/components/responses/Unavailable'
    '500':
      $ref: '#/components/responses/InternalError'

delete:
  summary: Delete the stored value of a config key
  description: |
    Deletes the stored value of the key, so that the service uses the value of its environment again (or has none when the environment has none). This is also the recovery when a stored secret cannot be decrypted. The change is recorded in the history.
    The `revision` query parameter is the revision that the caller read from `GET /service_configs/{service}`. When the stored revision is different the request is rejected with 409 and the reason `REVISION_MISMATCH`, and nothing is changed. When no value is stored and `revision` is 0 the request succeeds and returns the current state without a change or a history entry; when no value is stored and `revision` is not 0 the request is rejected with 409.
    The revision starts at 1 again when a key is deleted and set again, so a caller that still holds revision 1 from before the delete is not detected.
    Only secret keys can be deleted through this API.
    Requires the project super admin permission.
  tags:
    - ServiceConfig
  parameters:
    - $ref: '#/components/parameters/ServiceConfigService'
    - $ref: '#/components/parameters/ServiceConfigKeyName'
    - name: revision
      in: query
      required: true
      description: "The `revision` of the key returned from the `GET /service_configs/{service}` response. 0 means that the key has no stored value."
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 4294967295
        example: 3
  responses:
    '200':
      description: The key after the stored value was deleted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceConfigKey'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      $ref: '#/components/responses/Conflict'
    '503':
      $ref: '#/components/responses/Unavailable'
    '500':
      $ref: '#/components/responses/InternalError'

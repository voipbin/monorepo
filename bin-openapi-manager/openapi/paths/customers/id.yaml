get:
  summary: Retrieve customer details.
  description: Fetches detailed information about a specific customer by their ID.
  tags:
    - Customer
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomerManagerCustomerAdmin'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

put:
  summary: Update a customer.
  description: Updates the details of an existing customer and returns the updated information.
  tags:
    - Customer
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          description: >
            Every field is optional. Omitting a field leaves its current
            value unchanged; a full resend of every field is NOT required
            to update a single field (e.g. PUT { "name": "new name" } only
            renames the customer and leaves email/phone_number/address/
            webhook_method/webhook_uri exactly as they were).
          properties:
            name:
              type: string
              description: Omit to leave the current name unchanged.
            detail:
              type: string
              description: Omit to leave the current detail unchanged.
            email:
              type: string
              description: Omit to leave the current email unchanged.
            phone_number:
              type: string
              description: Omit to leave the current phone number unchanged.
            address:
              type: string
              description: Omit to leave the current address unchanged.
            webhook_method:
              allOf:
                - $ref: '#/components/schemas/CustomerManagerCustomerWebhookMethod'
              description: >
                Omit to leave the current webhook_method unchanged. NOTE:
                an explicit empty string ("") is a valid value meaning no
                webhook method, distinct from omitting the field.
            webhook_uri:
              type: string
              description: >
                Omit to leave the current webhook_uri unchanged. NOTE: an
                explicit empty string ("") is a valid value meaning no
                webhook target (disables webhook delivery), distinct from
                omitting the field.
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomerManagerCustomerAdmin'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

delete:
  summary: Delete a customer.
  description: Removes a customer by their ID.
  tags:
    - Customer
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomerManagerCustomerAdmin'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

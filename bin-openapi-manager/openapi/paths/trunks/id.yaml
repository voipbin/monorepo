get:
  summary: Retrieve trunk details.
  description: Retrieves the details of a specific trunk by its ID.
  tags:
    - Trunk
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: The trunk details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrarManagerTrunk'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

put:
  summary: Update a trunk.
  description: Updates the details of an existing trunk and returns the updated trunk's information.
  tags:
    - Trunk
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          description: >
            Every field is optional. Omitting a field leaves its current
            value unchanged; a full resend of every field is NOT required
            to update a single field (e.g. PUT { "name": "new name" } only
            renames the trunk and leaves auth_types/username/password/
            allowed_ips exactly as they were).
          properties:
            name:
              type: string
              description: "Omit to leave the current name unchanged."
            detail:
              type: string
              description: "Omit to leave the current detail unchanged."
            auth_types:
              type: array
              items:
                $ref: '#/components/schemas/RegistrarManagerAuthType'
              description: "Omit to leave the current auth_types unchanged. NOTE: an explicit empty array is a valid value meaning no auth types, distinct from omitting the field."
            username:
              type: string
              description: "Omit to leave the current username unchanged."
            password:
              type: string
              description: "SIP trunk password. Omit to leave the current password unchanged. Sending an explicit value (including empty string) replaces it."
            allowed_ips:
              type: array
              items:
                type: string
              description: "IP allowlist for this trunk. Omit to leave the current allowed_ips unchanged. NOTE: an explicit empty array clears the allowlist, distinct from omitting the field -- verify this is the intended effect before sending an empty array."
  responses:
    '200':
      description: The updated trunk details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrarManagerTrunk'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

delete:
  summary: Delete a trunk.
  description: Deletes an existing trunk by its ID.
  tags:
    - Trunk
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Trunk deleted successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrarManagerTrunk'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

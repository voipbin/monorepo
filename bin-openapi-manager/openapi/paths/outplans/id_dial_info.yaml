put:
  summary: Update dial information of an existing outplan.
  description: Updates the dial information for the outplan specified by the given ID and returns the updated outplan.
  tags:
    - Outplan
  parameters:
    - name: id
      in: path
      required: true
      description: The ID of the outplan to update.
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            source:
              $ref: '#/components/schemas/CommonAddress'
              description: The new source address. Omit to leave unchanged.
            dial_timeout:
              type: integer
              description: The new dial timeout in seconds. Omit to leave unchanged.
            try_interval:
              type: integer
              description: The new interval between retry attempts. Omit to leave unchanged.
            max_try_count_0:
              type: integer
              description: The new maximum retry count for destination 0. Omit to leave unchanged.
            max_try_count_1:
              type: integer
              description: The new maximum retry count for destination 1. Omit to leave unchanged.
            max_try_count_2:
              type: integer
              description: The new maximum retry count for destination 2. Omit to leave unchanged.
            max_try_count_3:
              type: integer
              description: The new maximum retry count for destination 3. Omit to leave unchanged.
            max_try_count_4:
              type: integer
              description: The new maximum retry count for destination 4. Omit to leave unchanged.
  responses:
    '200':
      description: The updated outplan with new dial information.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CampaignManagerOutplan'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

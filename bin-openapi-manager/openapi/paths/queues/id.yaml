get:
  summary: Get the queue by ID
  description: Retrieves the details of a specific queue by its ID.
  tags:
    - Queue
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: The queue details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QueueManagerQueue'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

delete:
  summary: Delete a queue by ID
  description: Deletes the queue specified by the given ID.
  tags:
    - Queue
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Queue deleted successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QueueManagerQueue'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

put:
  summary: Update the queue details
  description: >
    Updates the details of the queue identified by the given ID. All body
    fields are optional; omitted fields keep their current value
    unchanged. Explicitly sending an empty value (e.g. `tag_ids: []`)
    clears/resets that field. `wait_timeout: 0` / `service_timeout: 0`
    are real, meaningful values (disable auto-timeout), distinct from
    omitting the field.
  tags:
    - Queue
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              description: "Omit to leave the current name unchanged."
            detail:
              type: string
              description: "Omit to leave the current detail unchanged."
            routing_method:
              allOf:
                - $ref: '#/components/schemas/QueueManagerQueueRoutingMethod'
              description: "Omit to leave the current routing method unchanged."
            tag_ids:
              type: array
              items:
                type: string
              description: >
                Omit to leave the current tags unchanged. An explicit empty
                array ([]) clears all tags.
            wait_flow_id:
              type: string
              description: >
                Flow ID for the wait queue. Omit to leave the current
                wait flow unchanged.
            wait_timeout:
              type: integer
              description: >
                Omit to leave the current wait timeout unchanged. 0 is a
                real value meaning "no auto-timeout", distinct from omission.
            service_timeout:
              type: integer
              description: >
                Omit to leave the current service timeout unchanged. 0 is
                a real value meaning "no auto-timeout", distinct from
                omission.
  responses:
    '200':
      description: The updated queue details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QueueManagerQueue'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

put:
  summary: Update an agent's addresses
  description: |
    Update an agent's addresses and return updated details. The list replaces the stored addresses.
    The `extension` target is the extension id (UUID) and it is stored in the canonical form (lowercase, hyphenated).
    A `tel` address must contain at least one digit. This is the only way to assign an `extension` to an agent,
    and it requires the customer admin or manager permission.
  tags:
    - Agent
  parameters:
    - name: id
      in: path
      description: The ID of the agent.
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            addresses:
              type: array
              items:
                $ref: '#/components/schemas/CommonAddress'
  responses:
    '200':
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentManagerAgent'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

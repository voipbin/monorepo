get:
  summary: Get a route
  description: Returns the details of the route for the given ID.
  tags:
    - Route
  parameters:
    - name: id
      in: path
      required: true
      description: The route's ID.
      schema:
        type: string
  responses:
    '200':
      description: The route details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RouteManagerRoute'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

delete:
  summary: Delete the route
  description: Deletes the route for the given ID.
  tags:
    - Route
  parameters:
    - name: id
      in: path
      required: true
      description: The route's ID.
      schema:
        type: string
  responses:
    '200':
      description: The route has been deleted successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RouteManagerRoute'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

put:
  summary: Update a route
  description: Updates a route with the provided details and returns the updated route.
  tags:
    - Route
  parameters:
    - name: id
      in: path
      required: true
      description: The route's ID.
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          description: >
            Every field is optional. Omitting a field leaves its current
            value unchanged; a full resend of every field is NOT required
            to update a single field (e.g. PUT { "priority": 5 } only
            changes the route's priority and leaves name/detail/
            provider_id/target exactly as they were).
          properties:
            name:
              type: string
              description: Omit to leave the current name unchanged.
            detail:
              type: string
              description: Omit to leave the current detail unchanged.
            provider_id:
              type: string
              description: >
                Omit to leave the current provider_id unchanged. If
                present, must be a valid UUID referencing an existing
                provider.
            priority:
              type: integer
              description: >
                Omit to leave the current priority unchanged. Lower
                values are higher priority; 0 is a valid, meaningful
                value distinct from omission.
            target:
              type: string
              description: Omit to leave the current target unchanged.
  responses:
    '200':
      description: The updated route details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RouteManagerRoute'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '403':
      $ref: '#/components/responses/PermissionDenied'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

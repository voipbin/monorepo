get:
  summary: Gets a list of ai calls
  description: Retrieves a paginated list of ai calls based on the provided query parameters.
  tags:
    - AI
  parameters:
    - $ref: '#/components/parameters/PageSize'
    - $ref: '#/components/parameters/PageToken'
  responses:
    '200':
      description: A list of ai calls.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/CommonPagination'
              - type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/AIManagerAIcall'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '500':
      $ref: '#/components/responses/InternalError'

post:
  summary: Create a new aicall.
  description: >-
    Creates a new aicall and returns the created aicall's details.
    `reference_type` must be one of `call`, `conversation`, `contact_case`, or
    an empty string (no reference; `reference_id` is then ignored). For the
    other types the referenced resource must belong to the same customer as the
    assistance. An unsupported `reference_type` returns `400`; a reference that
    does not exist or does not belong to the customer returns `404`.
  tags:
    - AI
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            assistance_type:
              $ref: '#/components/schemas/AIManagerAIcallAssistanceType'
            assistance_id:
              type: string
            reference_type:
              $ref: '#/components/schemas/AIManagerAIcallReferenceType'
            reference_id:
              type: string
          required:
            - assistance_type
            - assistance_id
            - reference_type
            - reference_id
  responses:
    '200':
      description: Details of the created chatboaicall.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AIManagerAIcall'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthenticated'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/InternalError'

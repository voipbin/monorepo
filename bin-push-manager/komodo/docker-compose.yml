# Komodo Stack definition for bin-push-manager.
# See docs/plans/2026-08-18-bin-manager-komodo-rollout-tier1-design.md for
# the shared design.
#
# FCM service-account credential materialization: distroless images have no
# shell, so the container cannot write a file from an env var at startup.
# Same mechanism as bin-storage-manager: the `secrets:` block below pulls
# its content from the FCM_SA_JSON env var, which Komodo writes into this
# Stack's run-directory .env file (see komodo/environment.env in this
# directory, passed as komodo-api-deploy.sh's 3rd argument) before
# `docker compose up` runs. Docker Compose then materializes the file at
# /run/secrets/fcm_service_account.json on the host side; the service reads
# the path named by FCM_SERVICE_ACCOUNT_FILE. When the secret is empty the
# service still starts and reports every notification as not configured.
#
# distroless (gcr.io/distroless/static-debian12): no healthcheck block,
# same as the other distroless bin-*-manager services.
secrets:
  fcm_sa_json:
    environment: "FCM_SA_JSON"

services:
  push-manager:
    image: voipbin/bin-push-manager:__IMAGE_TAG__
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No fixed container_name: Docker Compose rejects a fixed container_name
    # together with deploy.replicas > 1. See
    # docs/plans/2026-08-28-bin-manager-two-replica-rollout-design.md and
    # docs/workflows/manager-replica-scaling.md.
    restart: always
    deploy:
      replicas: 2
    secrets:
      - source: fcm_sa_json
        target: fcm_service_account.json
    environment:
      - DATABASE_DSN=[[BIN_MANAGER__DATABASE_DSN_BIN]]
      - RABBITMQ_ADDRESS=[[BIN_MANAGER__RABBITMQ_ADDRESS]]
      - PROMETHEUS_ENDPOINT=/metrics
      - PROMETHEUS_LISTEN_ADDRESS=:2112
      - FCM_SERVICE_ACCOUNT_FILE=/run/secrets/fcm_service_account.json
    command: ./push-manager
    networks:
      default: {}
networks:
  default:
    name: production
    external: true

  bin-fixture-manager-deploy:
    docker:
      - image: cimg/base:2024.02
    resource_class: small
    steps:
      - checkout
      - run:
          name: Render image tag into Komodo compose fragment
          command: .circleci/scripts/render-image-tag.sh bin-fixture-manager/komodo/docker-compose.yml "$CIRCLE_SHA1"
      - run:
          name: Deploy bin-fixture-manager via Komodo API
          command: |
            CC_KOMODO_POLL_ATTEMPTS=60 CC_KOMODO_POLL_INTERVAL_S=3 \
              .circleci/scripts/komodo-api-deploy.sh bin-fixture-manager bin-fixture-manager/komodo/docker-compose.yml

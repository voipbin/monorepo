  # bin-dbscheme-manager: CI does not apply migrations. The production
  # bin_manager / asterisk databases are not reachable from CircleCI's
  # executors (confirmed 2026-07-11, VOIP-1246: a read-only DSN probe on
  # a throwaway branch timed out connecting to the production DB host --
  # it is intentionally not exposed to the public internet). alembic
  # upgrade/downgrade against staging or production remains a manual,
  # VPN-only, human-only procedure -- see
  # bin-dbscheme-manager/docs/operations.md. migration-applied-checkpoint
  # is kept as a documented manual checkpoint (e.g. "I have applied and
  # verified this migration over VPN") with no automated action behind
  # it; it does not build, push, or apply anything. It is intentionally
  # restricted to main only (see filters below) -- it attests that an
  # already-merged migration was applied to production, so approving it
  # on an unmerged PR branch would be a false signal.
  #
  # migration-lint runs on EVERY branch (including PR branches) that
  # touches bin-dbscheme-manager/**, with no approval gate. It performs a
  # lightweight, DB-connection-free structural validation of every Alembic
  # migration file via `alembic heads`/`alembic history` (parses revision
  # files, confirms exactly one head per stream, confirms no broken
  # down_revision references). See
  # bin-dbscheme-manager/docs/migrations.md for what it checks and
  # docs/plans/2026-07-18-dbscheme-pr-migration-validation-job-design.md
  # for the design rationale.
  bin-dbscheme-manager:
    when: << pipeline.parameters.run-bin-dbscheme-manager >>
    jobs:
      - migration-lint
      - migration-applied-checkpoint:
          type: approval
          filters:
            branches:
              only: main


  # bin-dbscheme-manager has no build/deploy job -- production DB is not
  # reachable from CircleCI, so all migration application is manual/VPN.
  # See bin-dbscheme-manager/docs/operations.md for why, and
  # migration-applied-checkpoint in the workflow definition above (main-only
  # approval attesting a migration was manually applied).
  #
  # migration-lint is the one automated CI job this service has: a
  # lightweight, DB-connection-free structural validation of the Alembic
  # migration chain, run on every branch. See
  # bin-dbscheme-manager/docs/migrations.md.
  migration-lint:
    docker:
      - image: python:3.11-slim
    steps:
      - checkout
      - run:
          name: Install alembic (metadata-only, no DB driver needed)
          no_output_timeout: 2m
          command: pip install --no-cache-dir "sqlalchemy<2.0" alembic
      - run:
          name: Validate bin-manager migration chain (voipbin DB)
          command: |
            cd bin-dbscheme-manager/bin-manager
            cp alembic.ini.sample alembic.ini
            # alembic.ini requires a sqlalchemy.url key to parse, but
            # `heads`/`history` never open it -- a syntactically valid but
            # unreachable placeholder is sufficient and deliberately used
            # instead of a real credential.
            HEAD_COUNT=$(alembic -c alembic.ini heads | grep -c '(head)')
            echo "Detected $HEAD_COUNT head(s):"
            alembic -c alembic.ini heads --verbose
            if [ "$HEAD_COUNT" -ne 1 ]; then
              echo "ERROR: expected exactly 1 head, found $HEAD_COUNT. Multiple heads means two migrations were authored against the same down_revision without rebasing -- see bin-dbscheme-manager/docs/migrations.md."
              exit 1
            fi
            alembic -c alembic.ini history --verbose > /dev/null
      - run:
          name: Validate asterisk_config migration chain (asterisk DB)
          command: |
            cd bin-dbscheme-manager/asterisk_config
            cp alembic.ini.sample alembic.ini
            HEAD_COUNT=$(alembic -c alembic.ini heads | grep -c '(head)')
            echo "Detected $HEAD_COUNT head(s):"
            alembic -c alembic.ini heads --verbose
            if [ "$HEAD_COUNT" -ne 1 ]; then
              echo "ERROR: expected exactly 1 head, found $HEAD_COUNT."
              exit 1
            fi
            alembic -c alembic.ini history --verbose > /dev/null


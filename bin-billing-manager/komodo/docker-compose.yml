# Komodo Stack definition for bin-billing-manager (VOIP-1347, Tier 1 rollout).
# See docs/plans/2026-08-18-bin-manager-komodo-rollout-tier1-design.md for
# the shared design (pattern proven by VOIP-1342/bin-call-manager).
services:
  billing-manager:
    image: voipbin/bin-billing-manager:__IMAGE_TAG__
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # container_name intentionally removed (was voipbin-billing-manager) -
    # Docker Compose rejects a fixed container_name together with
    # deploy.replicas > 1. Fleet rollout per
    # docs/plans/2026-08-28-bin-manager-two-replica-rollout-design.md and
    # docs/workflows/manager-replica-scaling.md.
    restart: always
    deploy:
      replicas: 2
    environment:
      - DATABASE_DSN=[[BIN_MANAGER__DATABASE_DSN_BIN]]
      - RABBITMQ_ADDRESS=[[BIN_MANAGER__RABBITMQ_ADDRESS]]
      - REDIS_ADDRESS=[[BIN_MANAGER__REDIS_ADDRESS]]
      - REDIS_DATABASE=1
      - PROMETHEUS_ENDPOINT=/metrics
      - PROMETHEUS_LISTEN_ADDRESS=:2112
      - PADDLE_API_KEY=[[BIN_MANAGER__PADDLE_API_KEY]]
      - PADDLE_WEBHOOK_SECRET=[[BIN_MANAGER__PADDLE_WEBHOOK_SECRET]]
      - BILLING_CONFIG_ENCRYPTION_KEYS=[[BIN_MANAGER__BILLING_MANAGER_CONFIG_ENCRYPTION_KEYS]]
    command: ./billing-manager
    networks:
      default: {}
networks:
  default:
    name: production
    external: true

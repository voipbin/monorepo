# Komodo Stack definition for bin-timeline-manager (VOIP-1349, Tier 3
# rollout). See docs/plans/2026-08-18-bin-manager-komodo-rollout-tier1-design.md
# for the shared design (pattern proven by VOIP-1342/bin-call-manager and
# VOIP-1347/VOIP-1348). NOTE: timeline-manager depends on clickhouse for
# event ingestion AND MySQL (DATABASE_DSN) for the activeflow analysis
# store (VOIP-1197) - omitting DATABASE_DSN silently disables all
# /v1/analyses routes with 503 (VOIP-1524). It does not use Redis.
services:
  timeline-manager:
    image: voipbin/bin-timeline-manager:__IMAGE_TAG__
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # container_name intentionally removed (was voipbin-timeline-manager) -
    # Docker Compose rejects a fixed container_name together with
    # deploy.replicas > 1. Fleet rollout per
    # docs/plans/2026-08-28-bin-manager-two-replica-rollout-design.md and
    # docs/workflows/manager-replica-scaling.md.
    restart: always
    deploy:
      replicas: 2
    environment:
      - DATABASE_DSN=[[BIN_MANAGER__DATABASE_DSN_BIN]]
      - RABBITMQ_ADDRESS=[[BIN_MANAGER__RABBITMQ_ADDRESS]]
      - CLICKHOUSE_ADDRESS=[[BIN_MANAGER__CLICKHOUSE_ADDRESS]]
      - CLICKHOUSE_DATABASE=[[BIN_MANAGER__CLICKHOUSE_DATABASE]]
      - HOMER_API_ADDRESS=[[BIN_MANAGER__HOMER_API_ADDRESS]]
      - HOMER_AUTH_TOKEN=[[BIN_MANAGER__HOMER_AUTH_TOKEN]]
      - PROMETHEUS_ENDPOINT=/metrics
      - PROMETHEUS_LISTEN_ADDRESS=:2112
    command: ./timeline-manager
    networks:
      default: {}
networks:
  default:
    name: production
    external: true
